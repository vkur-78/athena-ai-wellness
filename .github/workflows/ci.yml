name: CI & Core Contracts Verification Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Test & Build Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Backend Contracts & Regression Suite
        run: |
          cd backend
          pytest tests/test_production_core_contracts.py -v
          pytest tests/test_17_bugs_regression.py -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Verify Frontend Production Build
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
          BACKEND_URL: http://127.0.0.1:8001
